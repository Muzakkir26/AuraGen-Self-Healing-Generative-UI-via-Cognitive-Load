# .github/workflows/qa-test.yml
name: AuraGen Complete QA & Invariant Pipeline

on:
  push:
    branches: [ main, Member-04 ]
  pull_request:
    branches: [ main ]

jobs:
  qa-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Run Member-04 Real Module Cross-Team Tests
      - name: Real Module Cross-Team Tests
        run: node --test Integration_Testing/test_real_modules.test.js

      # 2. Run Member-04 Master Invariant Suite
      - name: Master Invariant & Benchmark Suite
        run: python run_auragen_suite.py

      # 3. Archive Test Logs & Benchmarks
      - name: Upload Test Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auragen-qa-deliverables
          path: |
            Test_Logs/
            Test_Cases/*.xlsx
            Performance_Evaluation/
            Screenshots/
